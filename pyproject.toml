[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omf"
version = "1.0.0"
description = "An Open Modeling Framework (OMF) for power systems simulation."
readme = "readme.md"
requires-python = ">=3.9"
license = { file = "License-GPLv2.txt" }
authors = [
  { name = "David Pinney", email = "david.pinney@nreca.coop" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.20,<2",
  "numpy-financial",
  "Flask>=2.0.0",
  "Markdown>=3.3",
  "boto3",
  "networkx",
  "passlib>=1.6.2",
  "matplotlib",
  "requests>=2.20",
  "pandas>=0.24.2",
  "pytz",
  "pulp>=1.6.8",
  "scipy>=1.4.1",
  "plotly>=4.0.0",
  "scikit-learn>=0.23.0",
  "pyproj",
  "gunicorn",
  "OpenDSSDirect.py[extras]",
  "seaborn",
  "pandapower>=3.1.2,<3.2",
  "matpowercaseframes",
  "openpyxl",
  "shapely",
  "nrel-pysam>=7.0.0",
  "imageio-ffmpeg",
  "access-parser",
]

[project.optional-dependencies]
ml = [
  "tensorflow",
  "prophet",
]

[project.urls]
Homepage = "https://omf.coop/"
Repository = "https://github.com/nreca-bts/omf"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
omf = ["**/*"]

[tool.setuptools.exclude-package-data]
omf = [
  ".git/**",
  "__pycache__/**",
  "*.py[cod]",
  "data/Model/admin/**",
  "scratch/**",
  "build/**",
  "dist/**",
  "omf.egg-info/**",
]

[tool.setuptools.packages.find]
include = ["omf*"]
exclude = ["omf.scratch*", "omf.build*", "omf.dist*"]
