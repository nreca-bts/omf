<head>
	{{ omfHeaders }}
	<script type="text/javascript" src="{{pathPrefix}}/static/plotly-1.50.1.min.js" onload="plotGraph()"></script>
	<script type="text/javascript">

		function populateTables() {
			var list = document.getElementsByTagName("td");
			for (var i = 0; i < list.length; i++) {
				let id = list[i].id;
				let data = allOutputData[id];
				int_data = parseFloat(data); //parseInt(data);
				if (!isNaN(int_data)) {
					list[i].innerHTML = int_data.toLocaleString();
				} else {
					list[i].innerHTML = data;
				}
			}
		}

		function openTab(evt, tabName) {
		    
		    var i, tabContent, tabLinks;

		    // Get all elements with class="tabContent" and hide them
			$(".tabContent").hide();

		    // Get all elements with class="tabLinks" and remove the class "active"
		    tabLinks = document.getElementsByClassName("tabLinks");
		    for (i = 0; i < tabLinks.length; i++) {
		        tabLinks[i].className = tabLinks[i].className.replace(" active", "");
		    }

		    // Show the current tab, and add an "active" class to the button that opened the tab
		    $("." + tabName).show();
		    //gebi(tabName).style.display = "block";
		    evt.currentTarget.className += " active";

		}


		function loadContent() {

			var numCols = parseInt(allOutputData['numScenarios'], 10);

							'<th class="batteryDisplay">Total Battery Power (kW)</th>'+
							'<th class="batteryDisplay">Total Battery Capacity (kWh)</th>'+
							'<th>Total Fossil Generation (kW)</th>'+

						'</tr>';

				indexString = '' + (i+1);

				} else {

				}
					
				row += '<td id="savings' + indexString + '"></td>'+

					'<td id="sizePVRounded' + indexString + '"></td>'+
					'<td id="sizeWindRounded' + indexString + '"></td>'+
					'<td id="powerBatteryRounded' + indexString + '"></td>'+
					'<td id="capacityBatteryRounded' + indexString + '"></td>'+
					'<td id="sizeDieselRounded' + indexString + '"></td>'+
					'<td id="avgOutage' + indexString + '"></td>'+
					'<td id="fuelUsedDieselRounded' + indexString + '"></td>'+

			}

				'<div class="tab">';

			for (var i = 0; i < numCols ; i++) {

				indexString = '' + (i+1);

				if (i==0) {
					content += '<button class="tabLinks active" onclick="openTab(event, \'building' + indexString + '\')">Building ' + indexString + '</button>';

				} else {
					content += '<div class="building' + indexString + ' tabContent ">';

			for (var i = 0; i < numCols ; i++) {

				indexString = '' + (i+1);

				//var link = "https://developer.nrel.gov/api/reopt/v2/job/" + allOutputData['runID' + indexString] + '/proforma?api_key=' + allOutputData['apiKey' + indexString];

			loadContent();

	<style type="text/css">
		table {
			width: 100%;
			border-spacing: 0px;
			table-layout: fixed;
			border-collapse: collapse;
		}
		tr:first-child {
			border-bottom: 1px solid black;
		}
		td,th {
			border: 0px;
			border-style: solid;
			border-color: black;
			text-align: right;
			vertical-align: center;
			overflow-wrap: break-word
		}
		td:first-child,th:first-child {
			border-right: 1px solid black;
			text-align: center;
		}
		.tab {
			overflow: hidden;
			margin-left: auto;
			margin-right: auto;
			width: 1000px;
			border-bottom: black;
			border-bottom-width: thin;
			border-bottom-style: solid;
		}

		.tab button {
			color: black;
			background-color: inherit;
			float: left;
			border: none;
			outline: none;
			cursor: pointer;
			padding: 14px 16px;
			border-radius: 5px 5px 0px 0px;
		}

		.tab button:hover {
			background-color: white;
		}

		.tab button.active {
			background-color: seagreen;
			color: white;
		}

		.tabcontent {
			display: none;
		}
	</style>
	
</head>

<body>
	{{ omfModelTitle }}
	<p class="reportTitle">Model Input</p>
	<div id="input" class="content">
		<form name="inputForm" action="/runModel/" onsubmit="event.preventDefault(); return isFormValid();" method="post">
			<div class="shortInput">
				<label>Model Type <a href="https://github.com/dpinney/omf/wiki/Models-~-microgridDesign2" target="blank">Help?</a></label>
				<input type="text" id="modelType" name="modelType" value="{{allInputDataDict.modelType}}" value="{{modelName}}" readonly/>
			</div>
			<div class="shortInput">
				<label>Model Name</label>
				<input type="text" id="modelName" name="modelName" value="{{allInputDataDict.modelName}}" pattern="^[\w\s\d\.-]+$" required="required">
			</div>
			<div class="shortInput">
				<label>User</label>
				<input type="text" id="user" name="user" value="{{allInputDataDict.user}}" readonly/>
			</div>
			<div class="shortInput">
				<label>Created</label>
				<input type="text" id="created" name="created" value="{{allInputDataDict.created}}" readonly/>
			</div>
			<div class="shortInput">

					<option value="5" {{ 'selected' if allInputDataDict.dieselMacrsOptionYears == '5' }}>5</option>
					<option value="7" {{ 'selected' if allInputDataDict.dieselMacrsOptionYears == '7' }}>7</option>
				</select>
			</div>
			{{ omfModelButtons }}
		</form>
	</div>
	{{ omfRunDebugBlock }}
	{% if modelStatus == 'finished' %}
	<div id="output">
		<table>
			<tr><th></th></tr>
		</table>
	</div>
	{{ rawOutputFiles }}
	{% endif %}
