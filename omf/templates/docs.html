<!doctype html>
<html>
<head>
	<title>{{ title }} - Open Modeling Framework</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="shortcut icon" href="/static/favicon.ico">
	<style>
		body {
			margin: 0;
			background: gainsboro;
			color: #222;
			font-family: Helvetica, Arial, sans-serif;
			line-height: 1.5;
		}
		#header {
			background: black;
			box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
			color: white;
			padding: 0.6em 0;
		}
		#headInnerBlock {
			box-sizing: border-box;
			max-width: 1000px;
			margin: 0 auto;
			padding: 0 10px;
		}
		#header a {
			color: white;
			text-decoration: none;
		}
		#header .section {
			color: lightgray;
			margin-left: 8px;
		}
		main {
			box-sizing: border-box;
			max-width: 980px;
			margin: 24px auto 40px;
			padding: 30px 36px;
			background: white;
			border: 1px solid lightgray;
			border-radius: 8px;
			box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
		}
		main > :first-child {
			margin-top: 0;
		}
		h1, h2, h3, h4, h5, h6 {
			line-height: 1.2;
			margin: 1.2em 0 0.55em;
		}
		p, ul, ol, table, pre, blockquote {
			margin: 0 0 1em;
		}
		ul, ol {
			padding-left: 2em;
		}
		a {
			color: seagreen;
		}
		img {
			max-width: 100%;
			height: auto;
		}
		code {
			background: #f3f4f5;
			border-radius: 4px;
			font-family: Menlo, Consolas, monospace;
			font-size: 0.92em;
			padding: 0.15em 0.3em;
		}
		pre {
			background: #f3f4f5;
			border-radius: 6px;
			overflow-x: auto;
			padding: 12px;
		}
		pre code {
			background: transparent;
			padding: 0;
		}
		table {
			border-collapse: collapse;
			width: 100%;
		}
		th, td {
			border: 1px solid lightgray;
			padding: 6px 8px;
			text-align: left;
			vertical-align: top;
		}
		th {
			background: #f3f4f5;
		}
		blockquote {
			border-left: 4px solid lightgray;
			color: #555;
			padding-left: 1em;
		}
		@media (max-width: 700px) {
			main {
				border-left: 0;
				border-radius: 0;
				border-right: 0;
				margin: 0;
				padding: 22px 18px;
			}
		}
	</style>
</head>
<body>
	<div id="header">
		<div id="headInnerBlock">
			<a href="/">Open Modeling Framework</a>
			<span class="section">Documentation</span>
		</div>
	</div>
	<main>
		{{ content|safe }}
	</main>
</body>
</html>
