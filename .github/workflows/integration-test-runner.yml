name: OMF Integration Tests

on: [push, pull_request]

jobs:
  PackageInstall:
    name: Pip install OMF on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OMF from git
        run: python -m pip install "omf @ git+${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}"
      - name: Smoke test imports
        run: python -m omf.runAllTests