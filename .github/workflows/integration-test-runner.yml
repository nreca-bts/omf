name: OMF Integration Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  PackageInstall:
    name: Pip install OMF on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04] # windows-latest, macos-latest
        python-version: ["3.11"]
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OMF
        run: python -m pip install .
      - name: Locate the installed REopt package
        id: reopt-path
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import importlib.util; from pathlib import Path; print("dir=" + str(Path(importlib.util.find_spec("omf").origin).parent / "solvers" / "reopt_jl"))' >> "$GITHUB_OUTPUT"
      # The root cache action is allowed upstream. Keep its path absent on a cold run
      # until all artifacts are present, so the post-job save cannot cache half a build.
      - name: Cache REopt Julia artifacts
        id: reopt-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ${{ runner.temp }}/reopt-cache
          key: reopt-sysimage-v2-${{ matrix.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-julia-1.9.4-${{ hashFiles('omf/solvers/reopt_jl/__init__.py', 'omf/solvers/reopt_jl/REoptSolver/**/*.jl', 'omf/solvers/reopt_jl/REoptSolver/Project.toml', 'omf/solvers/reopt_jl/REoptSolver/Manifest.toml', 'omf/solvers/reopt_jl/precompile_reopt.jl') }}
      - name: Restore installed REopt artifacts
        if: steps.reopt-cache.outputs.cache-hit == 'true'
        env:
          CACHE_DIR: ${{ runner.temp }}/reopt-cache
          REOPT_DIR: ${{ steps.reopt-path.outputs.dir }}
        run: |
          set -eu
          test -s "$CACHE_DIR/reopt_jl.so"
          test -f "$CACHE_DIR/instantiated.txt"
          julia_home="$HOME/.cache/omf/julia-1.9.4"
          mkdir -p "$julia_home" "$HOME/.julia"
          cp -a "$CACHE_DIR/runtime/." "$julia_home/"
          cp -a "$CACHE_DIR/depot/." "$HOME/.julia/"
          cp -a "$CACHE_DIR/instantiated.txt" "$CACHE_DIR/reopt_jl.so" "$REOPT_DIR/"
          echo "Restored the REopt system image and install marker from cache."
      - name: Run All OMF Tests
        working-directory: ${{ runner.temp }}
        run: python -m omf.runAllTests
      - name: Stage complete REopt artifacts for caching
        if: steps.reopt-cache.outputs.cache-hit != 'true'
        env:
          CACHE_DIR: ${{ runner.temp }}/reopt-cache
          REOPT_DIR: ${{ steps.reopt-path.outputs.dir }}
        run: |
          set -eu
          julia_home="$HOME/.cache/omf/julia-1.9.4"
          if ! test -s "$REOPT_DIR/reopt_jl.so" || ! test -f "$REOPT_DIR/instantiated.txt" ||
             ! test -x "$julia_home/bin/julia" || ! test -d "$HOME/.julia"; then
            echo "No complete REopt build was produced. The cache will not be saved."
            exit 0
          fi
          mkdir -p "$CACHE_DIR"
          mv "$julia_home" "$CACHE_DIR/runtime"
          mv "$HOME/.julia" "$CACHE_DIR/depot"
          cp -a "$REOPT_DIR/instantiated.txt" "$REOPT_DIR/reopt_jl.so" "$CACHE_DIR/"
