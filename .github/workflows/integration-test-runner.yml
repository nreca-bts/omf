name: OMF Integration Tests

on: [push, pull_request]

jobs:
  PackageInstall:
    name: Pip install OMF on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04] # windows-latest, macos-latest
        python-version: ["3.11"]
    steps:
      - name: Cache REOpt.jl artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cache/omf/julia-1.9.4
            ~/.julia
            omf/solvers/reopt_jl/instantiated.txt
            omf/solvers/reopt_jl/reopt_jl.so
          key: reopt-jl-${{ runner.os }}-julia-1.9.4-${{ hashFiles('omf/solvers/reopt_jl/__init__.py', 'omf/solvers/reopt_jl/REoptSolver/Project.toml', 'omf/solvers/reopt_jl/REoptSolver/Manifest.toml', 'omf/solvers/reopt_jl/REoptSolver/src/REoptSolver.jl', 'omf/solvers/reopt_jl/precompile_reopt.jl') }}
          restore-keys: |
            reopt-jl-${{ runner.os }}-julia-1.9.4-
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OMF from git
        run: python -m pip install "omf @ git+${{ github.server_url }}/${{ github.repository }}@${{ github.sha }}"
      - name: Run All OMF Tests
        run: python -m omf.runAllTests
