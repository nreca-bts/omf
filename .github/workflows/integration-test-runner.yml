name: OMF Integration Tests

on: [push, pull_request]

jobs:
  PackageInstall:
    name: Pip install OMF on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04] # windows-latest, macos-latest
        python-version: ["3.11"]
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OMF
        run: python -m pip install .
      - name: Locate the installed REopt package
        id: reopt-path
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'import importlib.util; from pathlib import Path; print("dir=" + str(Path(importlib.util.find_spec("omf").origin).parent / "solvers" / "reopt_jl"))' >> "$GITHUB_OUTPUT"
      - name: Restore REopt Julia artifacts
        id: reopt-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cache/omf/julia-1.9.4
            ~/.julia
            ${{ steps.reopt-path.outputs.dir }}/instantiated.txt
            ${{ steps.reopt-path.outputs.dir }}/reopt_jl.so
          key: reopt-sysimage-v1-${{ matrix.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-julia-1.9.4-${{ hashFiles('omf/solvers/reopt_jl/__init__.py', 'omf/solvers/reopt_jl/REoptSolver/**/*.jl', 'omf/solvers/reopt_jl/REoptSolver/Project.toml', 'omf/solvers/reopt_jl/REoptSolver/Manifest.toml', 'omf/solvers/reopt_jl/precompile_reopt.jl') }}
      - name: Check restored REopt system image
        if: steps.reopt-cache.outputs.cache-hit == 'true'
        env:
          REOPT_DIR: ${{ steps.reopt-path.outputs.dir }}
        run: |
          test -s "$REOPT_DIR/reopt_jl.so"
          test -f "$REOPT_DIR/instantiated.txt"
          echo "Restored the REopt system image and install marker from cache."
      - name: Run All OMF Tests
        working-directory: ${{ runner.temp }}
        run: python -m omf.runAllTests
      - name: Check for a newly built REopt system image
        id: reopt-built
        if: steps.reopt-cache.outputs.cache-hit != 'true'
        env:
          REOPT_DIR: ${{ steps.reopt-path.outputs.dir }}
        run: |
          if test -s "$REOPT_DIR/reopt_jl.so" && test -f "$REOPT_DIR/instantiated.txt"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No compiled REopt system image was produced. The cache will not be saved."
          fi
      - name: Save complete REopt Julia artifacts
        if: steps.reopt-built.outputs.ready == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cache/omf/julia-1.9.4
            ~/.julia
            ${{ steps.reopt-path.outputs.dir }}/instantiated.txt
            ${{ steps.reopt-path.outputs.dir }}/reopt_jl.so
          key: ${{ steps.reopt-cache.outputs.cache-primary-key }}
